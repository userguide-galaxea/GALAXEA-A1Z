name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"

      - name: Install Python
        run: uv python install 3.10

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Smoke-test wheel
        working-directory: ${{ runner.temp }}
        run: uv run --python 3.10 --isolated --no-project --with "${{ github.workspace }}"/dist/*.whl "${{ github.workspace }}/tests/package_smoke_test.py"

      - name: Type-check downstream usage
        working-directory: ${{ runner.temp }}
        run: uv run --python 3.10 --isolated --no-project --with mypy --with "${{ github.workspace }}"/dist/*.whl mypy --strict "${{ github.workspace }}/tests/typecheck_consumer.py"

      - name: Smoke-test source distribution
        working-directory: ${{ runner.temp }}
        run: uv run --python 3.10 --isolated --no-project --with "${{ github.workspace }}"/dist/*.tar.gz "${{ github.workspace }}/tests/package_smoke_test.py"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/a1z
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"

      - name: Publish
        run: uv publish
