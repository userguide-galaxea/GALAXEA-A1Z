[build-system]
requires = ["flit_core >= 3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "a1z"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["description"]
dependencies = [
    "numpy",
    "python-can>=4.0",
    "pin",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# gs_usb userspace backend (macOS/Windows with HHS adapter)
# libusb-package bundles the libusb binary (no brew/zadig libusb needed)
gs_usb = [
    "python-can[gs_usb]",
    "libusb-package",
    "libusb1>=3.1,<4",
]
# PEAK PCAN-USB adapter
pcan = [
    "python-can[pcan]",
]

[tool.flit.module]
name = "a1z"

[tool.ruff]
line-length = 119
lint.select = [
    "E",
    "F",
    "I",
]
lint.ignore = [
    "E501",
    "E741",
    "F841",
]
