[build-system]
requires = ["flit_core >= 3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "a1z"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["description"]
dependencies = [
    "numpy",
    "python-can>=4.0",
    "pin; platform_system != 'Windows'",
    "pyyaml",
]

[project.optional-dependencies]
# gs_usb userspace backend (macOS/Windows with HHS adapter)
# libusb-package bundles the libusb binary (no brew/zadig libusb needed)
gs_usb = [
    "python-can[gs_usb]",
    "libusb-package",
    "libusb1>=3.1,<4",
]
# PEAK PCAN-USB adapter
pcan = [
    "python-can[pcan]",
]

[project.urls]
Repository = "https://github.com/userguide-galaxea/GALAXEA-A1Z"

[tool.flit.module]
name = "a1z"

[tool.ruff]
line-length = 119
lint.select = [
    "E",
    "F",
    "I",
]
lint.ignore = [
    "E501",
    "E741",
    "F841",
]
